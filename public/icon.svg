<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #1a1a1a; }
      .book { fill: #ffffff; }
      .pages { fill: #e0e0e0; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .book { fill: #1a1a1a; }
      .pages { fill: #3a3a3a; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="37"/>
  <!-- Book cover back -->
  <rect class="pages" x="42" y="38" width="96" height="110" rx="4"/>
  <!-- Book pages -->
  <rect class="book" x="48" y="34" width="90" height="110" rx="3"/>
  <!-- Book spine / center fold -->
  <line x1="90" y1="34" x2="90" y2="144" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
  <!-- Left page lines -->
  <line class="pages" x1="58" y1="56" x2="82" y2="56" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="58" y1="68" x2="80" y2="68" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="58" y1="80" x2="78" y2="80" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="58" y1="92" x2="82" y2="92" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="58" y1="104" x2="76" y2="104" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="58" y1="116" x2="80" y2="116" stroke-width="3" stroke-linecap="round"/>
  <!-- Right page lines -->
  <line class="pages" x1="98" y1="56" x2="126" y2="56" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="98" y1="68" x2="122" y2="68" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="98" y1="80" x2="124" y2="80" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="98" y1="92" x2="120" y2="92" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="98" y1="104" x2="126" y2="104" stroke-width="3" stroke-linecap="round"/>
  <line class="pages" x1="98" y1="116" x2="118" y2="116" stroke-width="3" stroke-linecap="round"/>
  <!-- Bookmark ribbon -->
  <polygon class="bg" points="108,34 118,34 118,62 113,55 108,62"/>
</svg>